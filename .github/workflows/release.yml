name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:        # 手动触发也能跑（在仓库 Actions 标签页里点 Run）

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write           # 给 softprops/action-gh-release 写 release 资产

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true     # 用 `cross` 工具跨编 Linux ARM
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p borderless-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p borderless-cli --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="borderless-${{ matrix.target }}"
          mkdir -p "dist/$STAGE/examples"
          cp target/${{ matrix.target }}/release/borderless "dist/$STAGE/"
          cp README.md "dist/$STAGE/"
          cp examples/config.hub.toml   "dist/$STAGE/examples/"
          cp examples/config.spoke.toml "dist/$STAGE/examples/"
          tar -C dist -czf "$STAGE.tar.gz" "$STAGE"

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "borderless-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage/examples" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/borderless.exe "dist/$stage/"
          Copy-Item README.md "dist/$stage/"
          Copy-Item examples/config.hub.toml   "dist/$stage/examples/"
          Copy-Item examples/config.spoke.toml "dist/$stage/examples/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "$stage.zip"

      - name: Upload to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: borderless-${{ matrix.target }}
          path: |
            borderless-${{ matrix.target }}.tar.gz
            borderless-${{ matrix.target }}.zip
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            borderless-${{ matrix.target }}.tar.gz
            borderless-${{ matrix.target }}.zip
          fail_on_unmatched_files: false
